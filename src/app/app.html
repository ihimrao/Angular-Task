<div class="app-shell">
  <button
    type="button"
    class="sidebar-scrim"
    [class.sidebar-scrim--visible]="menuOpen()"
    aria-label="Close navigation"
    (click)="menuOpen.set(false)"
  ></button>

  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <div class="brand">
      <span class="brand__mark"><span></span><span></span><span></span></span>
      <span class="brand__name">nexora</span>
      <button
        type="button"
        class="sidebar-close"
        aria-label="Close navigation"
        (click)="menuOpen.set(false)"
      >
        <app-icon name="x" [size]="18" />
      </button>
    </div>

    <button type="button" class="workspace-switcher">
      <span class="workspace-avatar">AC</span>
      <span><strong>Acme Corp</strong><small>Enterprise workspace</small></span>
      <app-icon name="chevron-down" [size]="14" />
    </button>

    <nav class="main-nav" aria-label="Primary navigation">
      <span class="nav-label">Manage</span>
      <a routerLink="/users" routerLinkActive="nav-link--active" class="nav-link">
        <app-icon name="users" [size]="18" /><span>Members</span
        ><span class="nav-shortcut">G M</span>
      </a>
      <a routerLink="/roles" routerLinkActive="nav-link--active" class="nav-link">
        <app-icon name="shield" [size]="18" /><span>Roles & permissions</span>
      </a>
      <span class="nav-label nav-label--spaced">Platform</span>
      <button type="button" class="nav-link nav-link--muted" (click)="showNotifications()">
        <app-icon name="activity" [size]="18" /><span>Audit log</span
        ><span class="soon-tag">Soon</span>
      </button>
      <button type="button" class="nav-link nav-link--muted" (click)="showNotifications()">
        <app-icon name="grid" [size]="18" /><span>Integrations</span
        ><span class="soon-tag">Soon</span>
      </button>
      <button type="button" class="nav-link nav-link--muted" (click)="showHelp()">
        <app-icon name="settings" [size]="18" /><span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-card">
      <span class="sidebar-card__icon"><app-icon name="sparkles" [size]="16" /></span>
      <strong>Access health</strong>
      <p>Your organization security posture looks strong.</p>
      <div class="health-meter"><span></span></div>
      <small>84% secure</small>
    </div>

    <div class="sidebar-footer">
      <app-avatar firstName="Alex" lastName="Morgan" color="#d47952" size="small" />
      <div class="sidebar-footer__user">
        <strong>Alex Morgan</strong><span>Organization owner</span>
      </div>
      <button
        type="button"
        class="sidebar-footer__more"
        aria-label="Account options"
        (click)="showHelp()"
      >
        <app-icon name="chevron-down" [size]="15" />
      </button>
    </div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar__left">
        <button
          type="button"
          class="mobile-menu-button"
          aria-label="Open navigation"
          (click)="toggleMenu()"
        >
          <app-icon name="menu" [size]="20" />
        </button>
        <span class="topbar__context">Organization</span>
        <app-icon name="chevron-right" [size]="12" class="topbar__separator" />
        <strong>{{ pageTitle() }}</strong>
      </div>
      <div class="topbar__right">
        <span class="system-status"><span></span> All systems operational</span>
        <button type="button" class="topbar-button" aria-label="Help" (click)="showHelp()">
          <app-icon name="help" [size]="18" />
        </button>
        <button
          type="button"
          class="topbar-button notification-button"
          aria-label="Notifications"
          (click)="showNotifications()"
        >
          <app-icon name="bell" [size]="18" /><span></span>
        </button>
        <div class="topbar-divider"></div>
        <app-avatar firstName="Alex" lastName="Morgan" color="#d47952" size="small" />
        <div class="topbar-profile"><strong>Alex Morgan</strong><span>Owner</span></div>
      </div>
    </header>

    <main class="content"><router-outlet /></main>
  </div>
</div>

<app-toast-stack />
